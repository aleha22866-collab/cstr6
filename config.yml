# Учитывать ли предмет в основной руке (кроме брони на игроке)
include-main-hand: true

# Значение в % за 1 уровень атрибута на 1 предмете.
# Суммируется по всей надетой броне (и предмету в руке).
values:
  absorb: 3          # шанс поглотить весь урон от удара
  water_resist: 15   # сопротивление урону в воде
  fire_reduce: 25    # уменьшение длительности горения
  golden_heart: 4    # шанс (золотое сердце себе + иссушение атакующему, одним броском)
  levitation: 3      # шанс левитации атакующему + регенерация себе
  reflect: 4         # шанс вернуть урон атакующему
  fall_reduce: 15    # -% урона от падения за предмет
  blast_resist: 10   # +% сопротивления взрывам за предмет
  arrow_resist: 10   # +% сопротивления стрелам/снарядам за предмет
  frost_guard: 5     # шанс % замедлить атакующего при получении удара
  adrenaline: 4      # шанс % получить ускорение при получении удара

# Максимум суммарного значения в %
caps:
  absorb: 75
  water_resist: 80
  fire_reduce: 100
  golden_heart: 100
  levitation: 100
  reflect: 100
  fall_reduce: 90
  blast_resist: 80
  arrow_resist: 70
  frost_guard: 100
  adrenaline: 100

golden-heart:
  hearts: 1                 # сколько сердец даёт (1 сердце = 2 HP)
  max-absorption: 20.0      # потолок золотых HP
  wither-seconds: 2
  wither-amplifier: 0       # 0 = уровень I

levitation:
  levitation-seconds: 1
  levitation-amplifier: 0   # 0 = уровень I
  regen-seconds: 2
  regen-amplifier: 1        # 1 = уровень II

frost-guard:
  seconds: 3
  amplifier: 1              # 1 = Замедление II

adrenaline:
  seconds: 3
  amplifier: 1              # 1 = Скорость II

reflect:
  multiplier: 1.5           # 150% полученного урона
  feedback: true            # показывать надпись в action bar, когда отражение сработало

# ============================================================
#  Способности предметов в ЛЕВОЙ руке
# ============================================================

# Определять ли способности, если предмет взял сам создатель (для тестов)
roll-for-creator: false

messages:
  # Описание предмета, пока способности ещё не определены (любое число строк)
  pending-lore:
    - "&5Скрытые способности"
    - "&8Проявятся у нового владельца"
  # Описание предмета, если ни одна способность не выпала
  none-lore:
    - "&8Способности не проявились"
  # Сообщение игроку при определении (%abilities% — список названий)
  rolled: "&6Предмет пробудил способности: &f%abilities%"
  rolled-none: "&7Предмет не пробудил ни одной способности"
  # Сообщение жертве блокировки элитр
  elytra-blocked: "&cВаши элитры заблокированы на %seconds% сек!"
  # Надпись при срабатывании «Второго дыхания»
  second-wind: "&dВторое дыхание!"
  # Надпись при срабатывании «Возрождения Феникса»
  phoenix: "&6&lВозрождение Феникса!"

# Числовые параметры способностей
ability-settings:
  tenth-hit-every: 10        # tenth_hit: каждый N-й удар x2 урона
  warden-chance: 6           # warden_strike: шанс %
  warden-damage: 20          # warden_strike: доп. урон
  combat-speed-seconds: 2    # combat_speed: сколько секунд длится Скорость I после удара
  water-damage: 2            # water_damage: +урон в воде
  water-armor: 1             # water_armor: +броня в воде
  water-triple-chance: 8     # water_triple: шанс % тройного урона в воде
  golden-strike-chance: 8    # golden_strike: шанс %
  golden-strike-hearts: 3    # golden_strike: сколько золотых сердец
  weakening-chance: 5        # weakening_strike: шанс %
  weakening-seconds: 6
  lift-every: 10             # lift_strike: каждый N-й удар
  lift-seconds: 2
  elytra-jam-chance: 8       # elytra_jam: шанс %
  elytra-jam-seconds: 4
  armor-break-chance: 20     # armor_breaker: шанс %
  armor-break-multiplier: 2.0  # во сколько раз сильнее ломается броня
  nausea-every: 15           # nausea_strike: каждый N-й удар
  nausea-seconds: 5
  executioner-hearts: 7      # executioner: ниже скольких сердец у противника
  executioner-damage: 2
  last-stand-hearts: 7       # last_stand: ниже скольких сердец у вас
  last-stand-armor: 2
  calm-resist-chance: 5      # calm_resist: шанс % при ударе (если не горите)
  calm-resist-seconds: 3
  calm-resist-amplifier: 1   # 1 = Сопротивление II
  vampire-chance: 10         # vampire_bite: шанс %
  vampire-heal: 2            # сколько HP лечит (2 = 1 сердце)
  frost-strike-chance: 8     # frost_strike: шанс %
  frost-strike-seconds: 3
  frost-strike-amplifier: 1  # 1 = Замедление II
  ignite-chance: 8           # ignite_strike: шанс %
  ignite-seconds: 4
  sky-wrath-chance: 8        # sky_wrath: шанс %
  sky-wrath-damage: 18
  soft-landing-reduction: 50 # soft_landing: -% урона от падения
  second-wind-hearts: 5      # second_wind: срабатывает, если здоровья меньше N сердец
  second-wind-cooldown: 60   # откат в секундах
  second-wind-seconds: 5     # длительность Регенерации
  second-wind-amplifier: 4   # 2 = Регенерация III
  second-wind-absorb-hearts: 8

  # --- легендарные ---
  phoenix-cooldown: 300      # phoenix_rebirth: откат в секундах
  phoenix-heal-percent: 50   # % максимального здоровья после воскрешения
  phoenix-regen-seconds: 5
  phoenix-fire-seconds: 8    # огнестойкость после воскрешения
  phoenix-radius: 4          # радиус, в котором враги загораются
  phoenix-ignite-seconds: 4
  thunder-every: 12          # thunder_god: каждый N-й удар
  thunder-damage: 8
  thunder-targets: 3         # сколько врагов рядом поражает молния
  thunder-radius: 6
  soul-heal: 6               # soul_harvest: лечение за убийство (HP, 6 = 3 сердца)
  soul-absorb: 4             # золотые HP (4 = 2 сердца)
  soul-speed-seconds: 5
  titan-reduction: 0        # titan_skin: -% ко всему входящему урону
  time-stop-every: 20        # time_stop: каждый N-й удар
  time-stop-seconds: 2
  time-stop-radius: 5
  blood-rage-per-heart: 0.5  # blood_rage: +урон за каждое потерянное сердце
  blood-rage-max: 6          # максимум бонуса урона
  volcano-ignite-seconds: 3  # volcano_heart: сколько горит тот, кто бьёт вас
  storm-chance: 4            # storm_breath: шанс %
  storm-radius: 5
  storm-seconds: 4
  storm-levitation-seconds: 2  # длительность Левитации в бурю

  # --- ещё легендарные ---
  shadow-dodge-chance: 10    # shadow_dodge: шанс % увернуться от удара
  shadow-invis-seconds: 2
  shadow-speed-seconds: 2
  meteor-every: 25           # meteor_strike: каждый N-й удар
  meteor-damage: 10
  meteor-radius: 4
  meteor-ignite-seconds: 3
  treasure-xp-multiplier: 2  # treasure_hunter: множитель опыта с мобов
  treasure-double-chance: 25 # шанс % двойной добычи
  life-gift-hearts: 4        # life_gift: сколько сердец к максимуму здоровья
  death-mark-chance: 12      # death_mark: шанс % пометить цель
  death-mark-seconds: 8
  death-mark-bonus: 30       # +% урона по помеченной цели
  earthshaker-min-damage: 3  # earthshaker: от какого урона падения срабатывает волна
  earthshaker-multiplier: 1.5
  earthshaker-max: 20
  earthshaker-radius: 5
  execution-threshold: 20    # royal_execution: добивает, если здоровья цели меньше N%
  execution-cooldown: 20     # откат в секундах

# Порядок способностей на предмете по цвету названия (сверху вниз).
# Цвет берётся из первого цветового кода в name. Цвета, которых нет в списке, идут в конец.
color-order:
  - "&d"   # розовые (легендарные)
  - "&6"   # золотые
  - "&c"   # красные (Палач, Вампирский укус); переместите строку, если нужно выше или ниже
  - "&9"   # синие
  - "&8"   # серые

